<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book map</title>
<style>
/* Book map (F-013): the book runs top to bottom like a metro line diagram, thread lanes on the
   left, moments on the right. Bundled with the app, no network: system fonts only. */
:root {
  --bg: #F1F3F6; --surface: #FFFFFF; --ink: #16202C; --muted: #5A6575; --rule: #D3D9E2;
  --accent: #1E4E8C; --sel: #E2EAF5; --badge-ink: #FFFFFF;
  --l1: #C8323F; --l2: #2563C9; --l3: #1F8A4C; --l4: #BF7200;
  --l5: #7B45C2; --l6: #0A8794; --l7: #B23A79; --lo: #8C96A3;
  --f-sign: "sans-serif-condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --f-ui: "Roboto", system-ui, sans-serif;
  --f-book: "Noto Serif", "Droid Serif", Georgia, serif;
  --gut: 20px; --lw: 22px; --sy: 13px;
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1E1E1E; --ink: #E8EAED; --muted: #9AA3AF; --rule: #33393F;
  --accent: #8DB2EA; --sel: #24303F; --badge-ink: #121212;
  --l1: #F06A73; --l2: #6EA0F2; --l3: #4CC27E; --l4: #F0A63A;
  --l5: #A982EA; --l6: #3CC3CF; --l7: #E070AA; --lo: #6F7A89;
  color-scheme: dark;
}
@media (max-width: 480px) { :root { --lw: 19px; --gut: 16px; } }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 780px; margin: 0 auto; padding: 12px 12px 40px; display: grid; gap: 14px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.book { font-family: var(--f-book); font-weight: 600; font-size: 18px; margin: 0; }
.premise { font-family: var(--f-book); font-size: 16px; line-height: 1.5; margin: 0; max-width: 62ch; }
.stats { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 11px; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--accent); font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend svg { width: 13px; height: 13px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--surface);
  border-radius: 999px; padding: 3px 10px 3px 3px; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 3px; border-radius: 999px;
  background: var(--c); color: var(--badge-ink); font-family: var(--f-sign); font-weight: 700; font-size: 12px; line-height: 1; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note b { color: var(--ink); font-weight: 600; }

.map { position: relative; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding-bottom: 10px; }
.lanebar { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: var(--gut) var(--lanesW) 1fr;
  align-items: center; background: var(--surface); border-bottom: 1px solid var(--rule); padding: 7px 0; margin-bottom: 4px; border-radius: 10px 10px 0 0; }
.lanebar .heads { position: relative; height: 18px; }
.lanebar .badge { position: absolute; top: 0; transform: translateX(-50%); }
.lanebar .where { padding-left: 10px; font-family: var(--f-sign); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.row { display: grid; grid-template-columns: var(--gut) var(--lanesW) minmax(0, 1fr); }
.lanes { position: relative; }
.seg-l { position: absolute; width: 3px; margin-left: -1.5px; background: var(--c); top: 0; bottom: 0; border-radius: 2px; }
.seg-l.start { top: var(--sy); }
.seg-l.end { bottom: auto; height: var(--sy); }
.seg-l.faded { opacity: .22; }
.xchg { position: absolute; top: calc(var(--sy) - 6px); height: 12px; border-radius: 6px; background: var(--surface);
  border: 2px solid var(--muted); border: 2px solid color-mix(in srgb, var(--ink) 55%, transparent); }
.glyph { position: absolute; top: calc(var(--sy) - 7px); width: 14px; height: 14px; margin-left: -7px; }
.dim .glyph, .dim .xchg { opacity: .22; }

.moment .text { padding: 4px 10px; min-width: 0; }
.moment .label { font-size: 15px; font-weight: 500; }
.moment.key .label { font-weight: 700; }
.moment.otheronly .label { color: var(--muted); }
.moment .lk { margin-left: 6px; font-size: 12px; color: var(--accent); white-space: nowrap; }
.moment.sel { background: var(--sel); }
.moment.linked { background: var(--sel); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.moment.dim .label { opacity: .4; }

.chap .text { padding: 12px 10px 6px; display: grid; gap: 3px; }
.chap .num { font-family: var(--f-sign); font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.chap .title { font-family: var(--f-sign); font-weight: 700; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; line-height: 1.2; }
.chap .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { display: inline-block; width: 60px; height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--muted); }
.more { border: 0; background: none; padding: 2px 0; color: var(--accent); font-size: 13px; font-weight: 600; }

.here { border-top: 2px dashed var(--accent); margin-top: 6px; }
.here .text { padding: 10px; font-family: var(--f-sign); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }

.card { margin: 2px 10px 10px calc(var(--gut) + 4px); background: var(--bg); border: 1px solid var(--rule); border-radius: 8px;
  padding: 12px 14px; display: grid; gap: 10px; }
.card blockquote { margin: 0; font-family: var(--f-book); font-size: 16px; line-height: 1.55; }
.card .where2 { font-size: 13px; color: var(--muted); }
.card .tags { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.card .tag { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); font-size: 14px; }
.card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.card li button { text-align: left; width: 100%; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px;
  padding: 7px 9px; display: grid; gap: 2px; font-size: 14px; }
.card li .rel { font-family: var(--f-sign); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.card li .why { color: var(--muted); font-size: 13px; }
.card .hidden-link { font-size: 13px; color: var(--muted); }
.go { justify-self: start; border: 0; border-radius: 8px; background: var(--accent); color: var(--surface); padding: 8px 14px; font-weight: 600; }

.arcs { position: absolute; left: 0; top: 0; width: var(--gut); pointer-events: none; overflow: visible; }
.empty { padding: 24px 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:6px">
    <p class="book" id="book"></p>
    <p class="premise" id="premise"></p>
    <div class="stats" id="stats"></div>
  </header>
  <section style="display:grid;gap:10px" aria-label="Map settings">
    <div class="controls">
      <span class="seg" role="group" aria-label="Detail">
        <button type="button" id="mode-key" aria-pressed="true">Key moments</button>
        <button type="button" id="mode-all" aria-pressed="false">Every moment</button>
      </span>
      <span class="seg" role="group" aria-label="Spoilers" id="spoilers">
        <button type="button" id="cut-on" aria-pressed="true"></button>
        <button type="button" id="cut-off" aria-pressed="false">Whole book</button>
      </span>
    </div>
    <div class="legend" aria-label="Legend">
      <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.6" fill="var(--surface)" stroke="var(--muted)" stroke-width="2.4"/></svg>introduced</span>
      <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.4" fill="var(--muted)"/></svg>develops</span>
      <span><svg viewBox="0 0 14 14"><path d="M7 1.4 13 12.6H1z" fill="var(--muted)"/></svg>turns</span>
      <span><svg viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" fill="var(--muted)"/></svg>resolves</span>
      <span><svg viewBox="0 0 28 14"><rect x="1" y="1" width="26" height="12" rx="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="2"/></svg>threads meet</span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Threads"></div>
    <p class="note" id="note"></p>
  </section>
  <section class="map" id="map" aria-label="Book map">
    <div class="lanebar" id="lanebar"></div>
    <div id="rows"></div>
    <svg class="arcs" id="arcs" aria-hidden="true"></svg>
  </section>
</div>
<script>
(function () {
  "use strict";
  var KIND_WORD = { introduce: "introduced", develop: "develops", turn: "turns", resolve: "resolves" };
  var REL = {
    pays_off: ["Paid off in", "Pays off"], leads_to: ["Leads to", "Follows from"],
    supports: ["Supports", "Supported by"], contradicts: ["Contradicted by", "Contradicts"],
    needs: ["Needed by", "Builds on"]
  };
  var D = null, P = null;
  var state = { mode: "key", whole: true, sel: null, focus: null, expanded: {} };
  var el = function (id) { return document.getElementById(id); };
  function bridge() { return window.BookMapBridge || null; }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function permutations(n, visit) {
    var a = [], used = [];
    (function rec() {
      if (a.length === n) { visit(a); return; }
      for (var i = 0; i < n; i++) if (!used[i]) { used[i] = true; a.push(i); rec(); a.pop(); used[i] = false; }
    })();
  }
  function chapterParts(c) {
    var m = /^([IVXLC]+)\.\s+(.*)$/.exec(c.title || "");
    if (m) return { num: "Chapter " + m[1], title: m[2] };
    return { num: "", title: c.title || ("Chapter " + c.n) };
  }

  // Everything that depends only on the map, computed once.
  function prepare(d) {
    var byId = {}, laneIdx = {}, used = {}, perCh = {}, links = {}, maxWords = 1;
    d.moments.forEach(function (m) { byId[m.id] = m; (perCh[m.ch] = perCh[m.ch] || []).push(m); });
    d.chapters.forEach(function (c) { maxWords = Math.max(maxWords, c.words || 0); });
    d.lanes.forEach(function (l, i) {
      laneIdx[l.id] = i;
      l.color = "var(--l" + (i + 1) + ")";
      var letters = (l.name || l.id).replace(/^the\s+/i, "").replace(/[^A-Za-z0-9À-ɏЀ-ӿ]/g, "") || ("T" + (i + 1));
      var code = letters.charAt(0).toUpperCase();
      if (used[code]) code = code + (letters.charAt(1) || String(i + 1)).toLowerCase();
      used[code] = true;
      l.code = code;
      l.count = 0; l.first = 1e9; l.last = 0;
    });
    d.moments.forEach(function (m) {
      m.lanes.forEach(function (id) {
        var l = d.lanes[laneIdx[id]]; if (!l) return;
        l.count++; l.first = Math.min(l.first, m.ch); l.last = Math.max(l.last, m.ch);
      });
    });
    // lane order: the permutation that keeps the sum of meeting widths smallest
    var n = d.lanes.length, groups = [];
    d.moments.forEach(function (m) { if (m.lanes.length > 1) groups.push(m.lanes.map(function (id) { return laneIdx[id]; })); });
    var best = null, bestCost = Infinity;
    if (n <= 8) {
      permutations(n, function (perm) {
        var pos = []; perm.forEach(function (L, p) { pos[L] = p; });
        var cost = 0;
        for (var g = 0; g < groups.length && cost < bestCost; g++) {
          var lo = 99, hi = -1;
          for (var k = 0; k < groups[g].length; k++) { var p = pos[groups[g][k]]; if (p < lo) lo = p; if (p > hi) hi = p; }
          cost += hi - lo;
        }
        if (cost < bestCost) { bestCost = cost; best = perm.slice(); }
      });
    } else {
      best = d.lanes.map(function (_, i) { return i; });
    }
    if (best) best.forEach(function (L, p) { d.lanes[L].pos = p; });
    d.arcs.forEach(function (a) {
      (links[a.from] = links[a.from] || []).push({ other: a.to, dir: 0, type: a.type, why: a.why });
      (links[a.to] = links[a.to] || []).push({ other: a.from, dir: 1, type: a.type, why: a.why });
    });
    var key = {}; d.key.forEach(function (k) { key[k] = true; });
    return { byId: byId, laneIdx: laneIdx, links: links, key: key, perCh: perCh, maxWords: maxWords };
  }

  var lw = 22;
  function laneX(pos) { return 4 + pos * lw + lw / 2; }
  function cut() { return state.whole || !D.reader ? Infinity : D.reader; }

  function glyph(kind, c, x) {
    var s;
    if (kind === "introduce") s = '<circle cx="7" cy="7" r="4.6" fill="var(--surface)" stroke="' + c + '" stroke-width="2.4"/>';
    else if (kind === "turn") s = '<path d="M7 1.4 13 12.6H1z" fill="' + c + '"/>';
    else if (kind === "resolve") s = '<rect x="2" y="2" width="10" height="10" fill="' + c + '"/>';
    else s = '<circle cx="7" cy="7" r="5.4" fill="' + c + '"/>';
    return '<svg class="glyph" style="left:' + x + 'px" viewBox="0 0 14 14" aria-hidden="true">' + s + "</svg>";
  }

  function visible() {
    var limit = cut(), out = {};
    D.moments.forEach(function (m) {
      if (m.ch > limit) return;
      if (state.mode === "all" || P.key[m.id] || state.expanded[m.ch]) out[m.id] = true;
    });
    return out;
  }

  function renderHead() {
    var limit = cut(), shownLanes = [];
    el("book").textContent = D.title;
    // written from the whole book: hidden while the cut is on
    el("premise").textContent = limit === Infinity ? D.premise : "";
    el("premise").hidden = limit !== Infinity || !D.premise;
    var shownMoments = D.moments.filter(function (m) { return m.ch <= limit; }).length;
    el("stats").textContent = (limit === Infinity ? D.chapters.length + " chapters · " + D.moments.length + " moments · " + D.arcs.length + " links"
      : "Up to chapter " + D.reader + " · " + shownMoments + " moments");
    el("mode-key").setAttribute("aria-pressed", state.mode === "key");
    el("mode-all").setAttribute("aria-pressed", state.mode === "all");
    el("spoilers").hidden = !D.reader;
    el("cut-on").textContent = "Up to chapter " + D.reader;
    el("cut-on").setAttribute("aria-pressed", !state.whole);
    el("cut-off").setAttribute("aria-pressed", state.whole);
    var lanes = D.lanes.slice().sort(function (x, y) { return x.pos - y.pos; });
    var html = "";
    lanes.forEach(function (l) {
      var n = D.moments.filter(function (m) { return m.ch <= limit && m.lanes.indexOf(l.id) >= 0; }).length;
      if (!n) return;
      shownLanes.push(l);
      html += '<button type="button" class="chip" data-lane="' + esc(l.id) + '" style="--c:' + l.color + '" aria-pressed="' + (state.focus === l.id) + '">' +
        '<span class="badge" style="--c:' + l.color + '">' + esc(l.code) + "</span>" + esc(l.name) + ' <span class="n">' + n + "</span></button>";
    });
    el("chips").innerHTML = html;
    var f = state.focus && D.lanes[P.laneIdx[state.focus]];
    el("note").innerHTML = f
      ? "<b>" + esc(f.name) + "</b>" + (limit === Infinity && f.what ? ": " + esc(f.what) : "") + ". Tap it again to see every thread."
      : "Tap a thread to follow it. Tap a moment to read its sentence and its links.";
  }

  function render() {
    lw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lw")) || 22;
    var lanesW = 8 + D.lanes.length * lw;
    el("map").style.setProperty("--lanesW", lanesW + "px");
    renderHead();
    var vis = visible(), limit = cut();
    if (state.sel && !vis[state.sel]) state.sel = null;
    var items = [];
    D.chapters.forEach(function (c) {
      if (c.n > limit) return;
      items.push({ t: "ch", c: c });
      (P.perCh[c.n] || []).forEach(function (m) { if (vis[m.id]) items.push({ t: "m", m: m }); });
    });
    if (limit !== Infinity) items.push({ t: "here" });
    var range = {};
    items.forEach(function (it, i) {
      if (it.t !== "m") return;
      it.m.lanes.forEach(function (id) { var r = range[id] || (range[id] = [i, i]); if (i < r[0]) r[0] = i; if (i > r[1]) r[1] = i; });
    });
    var linked = {};
    if (state.sel) (P.links[state.sel] || []).forEach(function (k) { linked[k.other] = true; });

    var heads = "";
    D.lanes.forEach(function (l) {
      if (!range[l.id]) return;
      heads += '<span class="badge" style="--c:' + l.color + ";left:" + laneX(l.pos) + 'px">' + esc(l.code) + "</span>";
    });
    el("lanebar").innerHTML = '<span></span><div class="heads">' + heads + '</div><div class="where" id="where"></div>';

    var html = "";
    items.forEach(function (it, i) {
      var segs = "";
      D.lanes.forEach(function (l) {
        var r = range[l.id];
        if (!r || r[0] === r[1] || i < r[0] || i > r[1]) return;
        var cls = i === r[0] ? "start" : i === r[1] ? "end" : "";
        if (it.t !== "m" && cls) return;
        segs += '<i class="seg-l ' + cls + (state.focus && state.focus !== l.id ? " faded" : "") + '" style="--c:' + l.color + ";left:" + laneX(l.pos) + 'px"></i>';
      });
      if (it.t === "ch") {
        var c = it.c, parts = chapterParts(c), all = (P.perCh[c.n] || []).length;
        var shown = (P.perCh[c.n] || []).filter(function (m) { return vis[m.id]; }).length, more = "";
        if (state.mode === "key" && all > 0) {
          if (state.expanded[c.n]) more = '<button type="button" class="more" data-ch="' + c.n + '">Key moments only</button>';
          else if (shown < all) more = '<button type="button" class="more" data-ch="' + c.n + '">+' + (all - shown) + " more</button>";
        }
        html += '<div class="row chap" data-ch="' + c.n + '"><span></span><div class="lanes">' + segs + '</div><div class="text">' +
          (parts.num ? '<div class="num">' + esc(parts.num) + "</div>" : "") + '<div class="title">' + esc(parts.title) + '</div><div class="meta">' +
          (c.words ? "<span>" + c.words.toLocaleString("en-US") + ' words</span><span class="bar" aria-hidden="true"><b style="width:' + Math.round(100 * c.words / P.maxWords) + '%"></b></span>' : "") +
          "<span>" + all + (all === 1 ? " moment" : " moments") + "</span>" + more + "</div></div></div>";
      } else if (it.t === "here") {
        html += '<div class="row here"><span></span><div class="lanes"></div><div class="text">You are here · chapter ' + D.reader + "</div></div>";
      } else {
        var m = it.m, glyphs = "", xchg = "", ps = [];
        m.lanes.forEach(function (id) { var l = D.lanes[P.laneIdx[id]]; if (l) { ps.push(l.pos); glyphs += glyph(m.kind, l.color, laneX(l.pos)); } });
        if (ps.length > 1) {
          var lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps);
          xchg = '<i class="xchg" style="left:' + (laneX(lo) - 8) + "px;width:" + (laneX(hi) - laneX(lo) + 16) + 'px"></i>';
        }
        if (!ps.length) glyphs = glyph(m.kind, "var(--lo)", lanesW - 7);
        var nl = (P.links[m.id] || []).filter(function (k) { return P.byId[k.other] && P.byId[k.other].ch <= limit; }).length;
        var dim = state.focus && m.lanes.indexOf(state.focus) < 0;
        var cls = "row moment" + (P.key[m.id] && state.mode === "all" ? " key" : "") + (ps.length ? "" : " otheronly") +
          (state.sel === m.id ? " sel" : "") + (linked[m.id] ? " linked" : "") + (dim ? " dim" : "");
        html += '<div class="' + cls + '" data-id="' + esc(m.id) + '" tabindex="0" role="button" aria-expanded="' + (state.sel === m.id) + '"' +
          ' aria-label="' + esc(m.label + ", " + KIND_WORD[m.kind] + ", chapter " + m.ch) + '"><span></span><div class="lanes">' + segs + xchg + glyphs +
          '</div><div class="text"><span class="label">' + esc(m.label) + "</span>" + (nl ? '<span class="lk">' + nl + (nl === 1 ? " link" : " links") + "</span>" : "") + "</div></div>";
        if (state.sel === m.id) html += card(m, limit);
      }
    });
    el("rows").innerHTML = html || '<div class="empty">Nothing to show up to this chapter yet.</div>';
    requestAnimationFrame(drawArcs);
    whereNow();
  }

  function card(m, limit) {
    var tags = m.lanes.map(function (id) {
      var l = D.lanes[P.laneIdx[id]];
      return l ? '<span class="tag"><span class="badge" style="--c:' + l.color + '">' + esc(l.code) + "</span>" + esc(l.name) + "</span>" : "";
    }).join("");
    if (m.others && m.others.length) tags += "<span>also " + esc(m.others.join(", ")) + "</span>";
    var where = "Chapter " + m.ch + " · about " + Math.max(1, Math.round(m.at * 100)) + "% of the way in · " + KIND_WORD[m.kind];
    var lis = (P.links[m.id] || []).slice().sort(function (x, y) {
      return D.moments.indexOf(P.byId[x.other]) - D.moments.indexOf(P.byId[y.other]);
    }).map(function (k) {
      var o = P.byId[k.other]; if (!o) return "";
      var rel = (REL[k.type] || [k.type, k.type])[k.dir];
      if (o.ch > limit) return '<li class="hidden-link">One link goes past chapter ' + D.reader + ". It stays hidden until you get there.</li>";
      return '<li><button type="button" data-go="' + esc(o.id) + '"><span class="rel">' + esc(rel) + " · chapter " + o.ch + "</span><span>" + esc(o.label) +
        '</span><span class="why">' + esc(k.why) + "</span></button></li>";
    }).join("");
    var q = /^[“"]/.test(m.quote) ? m.quote : "“" + m.quote + "”";
    return '<div class="card" role="region" aria-label="' + esc(m.label) + '"><blockquote>' + esc(q) + '</blockquote><div class="where2">' + esc(where) +
      '</div><div class="tags">' + tags + "</div>" + (lis ? "<ul>" + lis + "</ul>" : "") +
      (bridge() ? '<button type="button" class="go" data-jump="' + esc(m.id) + '">Go to page</button>' : "") + "</div>";
  }

  function drawArcs() {
    var svg = el("arcs"), map = el("map");
    svg.setAttribute("height", map.offsetHeight);
    svg.style.height = map.offsetHeight + "px";
    if (!state.sel) { svg.innerHTML = ""; return; }
    var row = map.querySelector(".row");
    var gut = row ? parseFloat(getComputedStyle(row).gridTemplateColumns) || 20 : 20;
    var from = map.querySelector('.moment[data-id="' + CSS.escape(state.sel) + '"]');
    if (!from) { svg.innerHTML = ""; return; }
    var y0 = from.offsetTop + 13, x = gut - 2, out = "";
    (P.links[state.sel] || []).forEach(function (k) {
      var to = map.querySelector('.moment[data-id="' + CSS.escape(k.other) + '"]');
      if (!to) return;
      var y1 = to.offsetTop + 13, bend = Math.max(2, x - 5 - Math.min(gut - 8, Math.abs(y1 - y0) / 40));
      out += '<path d="M' + x + " " + y0 + " C" + bend + " " + y0 + " " + bend + " " + y1 + " " + x + " " + y1 + '" fill="none" stroke="var(--accent)" stroke-width="2"' +
        (k.type === "contradicts" ? ' stroke-dasharray="4 3"' : "") + "/>";
      out += '<circle cx="' + x + '" cy="' + y1 + '" r="3" fill="var(--accent)"/>';
    });
    out += '<circle cx="' + x + '" cy="' + y0 + '" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>';
    svg.innerHTML = out;
  }

  function select(id, scroll) {
    var m = P.byId[id];
    if (!m) return;
    if (state.mode === "key" && !P.key[id]) state.expanded[m.ch] = true;
    state.sel = state.sel === id && !scroll ? null : id;
    render();
    if (scroll) {
      var row = el("rows").querySelector('.moment[data-id="' + CSS.escape(id) + '"]');
      if (row) row.scrollIntoView({ block: "center" });
    }
  }

  function whereNow() {
    var w = el("where");
    if (!w || !D) return;
    var bar = el("lanebar").getBoundingClientRect().bottom, name = "";
    var chs = el("rows").querySelectorAll(".chap");
    for (var i = 0; i < chs.length; i++) {
      if (chs[i].getBoundingClientRect().top <= bar + 4) {
        var n = +chs[i].dataset.ch;
        D.chapters.forEach(function (c) {
          if (c.n !== n) return;
          var title = chapterParts(c).title;
          // a title that names its chapter already ("Chapter I") is not prefixed again
          name = /^(chapter|part|book|section)\b/i.test(title) ? title : "Chapter " + c.n + " · " + title;
        });
      } else break;
    }
    w.textContent = name;
  }

  document.addEventListener("click", function (e) {
    if (!D) return;
    var t = e.target.closest("button, .moment");
    if (!t) return;
    if (t.id === "mode-key" || t.id === "mode-all") { state.mode = t.id === "mode-key" ? "key" : "all"; state.expanded = {}; render(); return; }
    if (t.id === "cut-on" || t.id === "cut-off") {
      state.whole = t.id === "cut-off";
      var b = bridge(); if (b) b.setWhole(state.whole);
      render(); return;
    }
    if (t.dataset.lane) { state.focus = state.focus === t.dataset.lane ? null : t.dataset.lane; render(); return; }
    if (t.classList.contains("more")) { var n = +t.dataset.ch; state.expanded[n] = !state.expanded[n]; render(); return; }
    if (t.dataset.go) { select(t.dataset.go, true); return; }
    if (t.dataset.jump) { var br = bridge(); if (br) br.jump(t.dataset.jump); return; }
    if (t.classList.contains("moment")) select(t.dataset.id, false);
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("moment") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(t.dataset.id, false); }
  });
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { ticking = false; whereNow(); });
  }, { passive: true });
  window.addEventListener("resize", function () { if (D) render(); });
  if (window.ResizeObserver) new ResizeObserver(function () { requestAnimationFrame(drawArcs); }).observe(el("rows"));

  // Called by the app: the map's data (MapData.join) and the reader's theme.
  window.BookMap = {
    render: function (data, dark) {
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      D = data;
      P = prepare(D);
      state.whole = !!D.whole || !D.reader;
      state.sel = null; state.focus = null; state.expanded = {};
      render();
    }
  };
})();
</script>
</body>
</html>
