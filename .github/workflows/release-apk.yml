# Builds release APKs with the Build APK workflow (unit tests, native library, the F-Droid and the
# regular flavor) and publishes them as a GitHub release.
#
# Signing. An installed app only updates over an APK signed with the same key. Add the key of the
# build machine as repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_KEYSTORE_BASE64   `base64 -w0 ~/.android/debug.keystore` (or of a PKCS12 release key)
#   SIGNING_STORE_PASSWORD    only when it is not the debug key's `android`
#   SIGNING_KEY_ALIAS         only when it is not the debug key's `androiddebugkey`
#   SIGNING_KEY_PASSWORD      only when it is not the debug key's `android`
# Without SIGNING_KEYSTORE_BASE64 the run makes a key of its own and throws it away: that APK
# installs only where the app is not installed yet, and the release is marked a pre-release.
#
# Optional: LIBRERA_GRADLE_PROPERTIES, lines of key=value added to gradle.properties, for real
# keys of the regular flavor (librera_appGdriveKey, librera_admobAppId, librera_admobBannerId,
# librera_admobFullId, librera_admobRewardId). Without it that flavor shows Google's test ads and
# has no Google Drive sync.
name: Release APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: master
      flavors:
        description: What to release
        type: choice
        default: F-Droid and regular
        options:
          - F-Droid and regular
          - F-Droid only
          - Regular only
      prerelease:
        description: Mark the release as a pre-release (always so for other branches than the default)
        type: boolean
        default: false
      tag:
        description: Release tag (default v<version>-<date>-<commit>)
        default: ""

permissions:
  contents: write

concurrency:
  group: release-apk-${{ inputs.ref || 'master' }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    with:
      ref: ${{ inputs.ref || 'master' }}
      flavors: >-
        ${{ inputs.flavors == 'F-Droid only' && '["fdroid"]'
         || inputs.flavors == 'Regular only' && '["librera"]'
         || '["fdroid", "librera"]' }}
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ inputs.ref || 'master' }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          OWN_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MUPDF_VERSION: 1.28.5
        run: |
          shopt -s nullglob
          SHA=$(git rev-parse HEAD)
          FD_VERSION=$(sed -n 's/^ *FDroidVersionNumber = "\(.*\)"/\1/p' app/build.gradle | head -n 1)
          APP_VERSION="$(sed -n 's/^appVersionNumberBase=//p' app/gradle.properties).$(sed -n 's/^appVersionNumberIndex=//p' app/gradle.properties)"
          TAG="${INPUT_TAG:-v$FD_VERSION-$(date -u +%Y%m%d)-${SHA:0:7}}"
          FLAGS=()
          if [ "$INPUT_PRERELEASE" = true ] || [ "$OWN_KEY" != true ] || [ "$BUILD_REF" != "$DEFAULT_BRANCH" ]; then
            FLAGS+=(--prerelease)
          fi
          FD_APKS=(dist/*Fdroid*.apk)
          APP_APKS=(dist/*-Librera-*.apk)
          {
            echo "Built from \`$BUILD_REF\` at $SHA with MuPDF $MUPDF_VERSION."
            echo
            if [ ${#FD_APKS[@]} -gt 0 ]; then
              echo "- **Librera FD $FD_VERSION** (\`Librera-Fdroid-*\`): the F-Droid build, no Google services or ads."
            fi
            if [ ${#APP_APKS[@]} -gt 0 ]; then
              echo "- **Librera $APP_VERSION** (\`Librera-Librera-*\`): the regular app, with Google Drive and ads. It is a separate app and installs next to Librera FD."
            fi
            echo
            echo "Which file: \`-arm64.apk\` fits most phones and tablets, \`-arm.apk\` is for old 32-bit devices, \`-uni.apk\` holds every architecture."
            echo
            if [ "$OWN_KEY" = true ]; then
              echo "Signed with the repository's signing key, so it installs over an app signed with the same key and keeps its data."
            else
              echo "**Signed with a throwaway key.** It installs only where the app is not installed: over an installed one, Android answers \"App not installed\". Uninstalling first deletes the app's own data on that device."
            fi
            echo
            for f in dist/signing-cert-*.txt; do
              flavor=$(basename "$f" .txt); flavor=${flavor#signing-cert-}
              echo "Signing certificate SHA-256 ($flavor): \`$(cat "$f")\`"
              echo
            done
          } > notes.md
          gh release create "$TAG" dist/*.apk --target "$SHA" \
            --title "Librera $FD_VERSION ($BUILD_REF ${SHA:0:7})" --notes-file notes.md "${FLAGS[@]}"
          echo "Release: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mappings
          path: dist/mapping-*.txt
          retention-days: 90
